<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXT</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif;
background:#f5f7fb;
color:#171717;
}

.app{
max-width:650px;
margin:auto;
min-height:100vh;
padding-bottom:100px;
}

header{
padding:35px 22px 20px;
}

.logo{
font-size:36px;
font-weight:800;
letter-spacing:-1px;
}

.subtitle{
color:#777;
margin-top:4px;
}

.card{
background:white;
margin:12px 18px;
padding:20px;
border-radius:20px;
box-shadow:0 4px 18px rgba(0,0,0,.05);
}

h2{
font-size:20px;
margin-top:0;
}

input,select{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
margin:7px 0 12px;
}

button{
border:0;
border-radius:12px;
padding:12px 18px;
font-size:15px;
font-weight:600;
background:#111;
color:white;
cursor:pointer;
}

.full{
width:100%;
margin-top:8px;
}

.secondary{
background:#eee;
color:#333;
}

.danger{
background:#eee;
color:#777;
font-size:13px;
padding:8px 12px;
}

.progress{
height:10px;
background:#e8e8e8;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.progress-bar{
height:100%;
background:#111;
border-radius:10px;
transition:.3s;
}

.goal{
padding:16px 0;
border-bottom:1px solid #eee;
}

.goal:last-child{
border-bottom:none;
}

.goal-title{
font-size:19px;
font-weight:750;
}

.goal-date{
font-size:13px;
color:#888;
margin-top:4px;
}

.goal-progress{
font-size:13px;
color:#777;
margin-top:8px;
}

.child{
margin:12px 0 0 14px;
padding:14px;
border-left:3px solid #ddd;
background:#fafafa;
border-radius:10px;
}

.child-title{
font-weight:700;
}

.page{
display:none;
}

.page.active{
display:block;
}

.empty{
text-align:center;
color:#999;
padding:20px;
}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:78px;
background:rgba(255,255,255,.96);
border-top:1px solid #ddd;
display:flex;
justify-content:space-around;
align-items:center;
}

nav button{
background:none;
color:#777;
padding:8px;
font-size:13px;
}

nav button.active{
color:#111;
font-weight:800;
}

.level{
display:flex;
justify-content:space-between;
align-items:center;
}

.level-number{
font-size:30px;
font-weight:800;
}

.small{
color:#777;
font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">NEXT</div>
<div class="subtitle">昨日の自分を、今日超える。</div>
</header>


<!-- HOME -->

<main id="home" class="page active">

<div class="card">

<div class="level">

<div>
<div class="small">CURRENT LEVEL</div>
<div class="level-number">
LEVEL <span id="level">1</span>
</div>
</div>

<div class="small">
<span id="exp">0</span> EXP
</div>

</div>

<div class="progress">
<div class="progress-bar" id="levelBar"></div>
</div>

</div>


<div class="card">

<h2>🎯 現在の目標</h2>

<div id="homeGoals"></div>

</div>

</main>


<!-- GOALS -->

<main id="goals" class="page">

<div class="card">

<h2>🎯 新しい目標</h2>

<input
id="goalName"
type="text"
placeholder="例：京都TOP16"
>

<input
id="goalDate"
type="date"
>

<button class="full" onclick="addGoal()">
＋ 目標を追加
</button>

</div>


<div class="card">

<h2>📋 目標一覧</h2>

<div id="goalList"></div>

</div>

</main>


<!-- TASK -->

<main id="tasks" class="page">

<div class="card">

<h2>☀️ 今日やること</h2>

<p class="small">
長期目標から今日やる行動を決めよう。
</p>

<input
id="taskInput"
type="text"
placeholder="例：フットワーク15分"
>

<button class="full" onclick="addTask()">
＋ 今日の行動を追加
</button>

<div id="taskList"></div>

</div>

</main>


<!-- AI COACH -->

<main id="aiCoach" class="page">

<div class="card">

<h2>🤖 AIコーチ</h2>

<p class="small">
あなたの目標から、次にやるべきことを整理します。
</p>

<button class="full" onclick="createPlan()">
✨ 計画を作る
</button>

</div>


<div class="card" id="aiResult" style="display:none;">

<h2>📋 今週のプラン</h2>

<div id="planText"></div>

</div>

</main>
  
  <!-- REVIEW -->

<main id="review" class="page">

<div class="card">

<h2>📝 振り返り</h2>

<p>
この機能は次のアップデートで追加する予定。
</p>

<p class="small">
今日できたこと、課題、明日やることを記録できるようにします。
</p>

</div>

</main>


<nav>

<button id="navHome" class="active"
onclick="showPage('home',this)">
🏠<br>ホーム
</button>

<button id="navGoals"
onclick="showPage('goals',this)">
🎯<br>目標
</button>

<button id="navTasks"
onclick="showPage('tasks',this)">
☀️<br>今日
</button>

<button id="navReview"
onclick="showPage('review',this)">
📝<br>振り返り
</button>

<button id="navAI"
onclick="showPage('aiCoach',this)">
🤖<br>AI
</button>

</nav>

</div>


<script>

let goals=
JSON.parse(localStorage.getItem("NEXT_goals")||"[]");

let tasks=
JSON.parse(localStorage.getItem("NEXT_tasks")||"[]");

let exp=
Number(localStorage.getItem("NEXT_exp")||0);


function save(){

localStorage.setItem(
"NEXT_goals",
JSON.stringify(goals)
);

localStorage.setItem(
"NEXT_tasks",
JSON.stringify(tasks)
);

localStorage.setItem(
"NEXT_exp",
exp
);

}


function updateLevel(){

let level=
Math.floor(exp/100)+1;

let current=
exp%100;

document.getElementById("level")
.textContent=level;

document.getElementById("exp")
.textContent=exp;

document.getElementById("levelBar")
.style.width=current+"%";

}


function addGoal(){

let name=
document.getElementById("goalName")
.value.trim();

let date=
document.getElementById("goalDate")
.value;

if(!name){

alert("目標名を入力してください");

return;

}

let goal={

id:Date.now(),

name:name,

date:date,

progress:0,

month:[],

week:[],

today:[]

};

goals.push(goal);

save();

renderGoals();

document.getElementById("goalName")
.value="";

document.getElementById("goalDate")
.value="";

}


function deleteGoal(id){

goals=
goals.filter(g=>g.id!==id);

save();

renderGoals();

}


function updateGoalProgress(id,value){

let goal=
goals.find(g=>g.id===id);

if(!goal)return;

goal.progress=
Math.max(0,Math.min(100,Number(value)));

save();

renderGoals();

}


function addChild(id,type){

let text=
prompt(
type==="month"
?"今月の目標を入力してください":
type==="week"
?"今週の目標を入力してください":
"今日やることを入力してください"
);

if(!text)return;

let goal=
goals.find(g=>g.id===id);

if(!goal)return;

goal[type].push({

id:Date.now(),

text:text,

done:false

});

save();

renderGoals();

}


function deleteChild(goalId,type,childId){

let goal=
goals.find(g=>g.id===goalId);

if(!goal)return;

goal[type]=
goal[type].filter(
item=>item.id!==childId
);

save();

renderGoals();

}


function toggleChild(goalId,type,childId){

let goal=
goals.find(g=>g.id===goalId);

if(!goal)return;

let child=
goal[type].find(
item=>item.id===childId
);

if(!child)return;

child.done=!child.done;

if(child.done){

exp+=10;

}else{

exp=Math.max(0,exp-10);

}

save();

updateLevel();

renderGoals();

renderTasks();

}


function renderGoals(){

let list=
document.getElementById("goalList");

let home=
document.getElementById("homeGoals");


if(goals.length===0){

list.innerHTML=
'<div class="empty">まだ目標がありません。</div>';

home.innerHTML=
'<div class="empty">「目標」から追加してみよう。</div>';

return;

}


list.innerHTML=
goals.map(goal=>`

<div class="goal">

<div class="goal-title">
🎯 ${escapeHTML(goal.name)}
</div>

${
goal.date
?
`<div class="goal-date">
期限：${goal.date}
</div>`
:""
}

<div class="goal-progress">
進捗：${goal.progress}%
</div>

<input
type="range"
min="0"
max="100"
value="${goal.progress}"
oninput="updateGoalProgress(${goal.id},this.value)"
>

<div class="progress">

<div
class="progress-bar"
style="width:${goal.progress}%">
</div>

</div>


<div class="child">

<div class="child-title">
📅 今月
</div>

${
goal.month.map(item=>`

<div style="margin-top:10px">

<input
type="checkbox"
${item.done?"checked":""}
onchange="toggleChild(${goal.id},'month',${item.id})"
>

${escapeHTML(item.text)}

<button
class="danger"
onclick="deleteChild(${goal.id},'month',${item.id})">
削除
</button>

</div>

`).join("")
}

<button
class="secondary"
style="margin-top:10px"
onclick="addChild(${goal.id},'month')">
＋ 今月の目標
</button>

</div>


<div class="child">

<div class="child-title">
📆 今週
</div>

${
goal.week.map(item=>`

<div style="margin-top:10px">

<input
type="checkbox"
${item.done?"checked":""}
onchange="toggleChild(${goal.id},'week',${item.id})"
>

${escapeHTML(item.text)}

<button
class="danger"
onclick="deleteChild(${goal.id},'week',${item.id})">
削除
</button>

</div>

`).join("")
}

<button
class="secondary"
style="margin-top:10px"
onclick="addChild(${goal.id},'week')">
＋ 今週の目標
</button>

</div>


<div class="child">

<div class="child-title">
☀️ 今日
</div>

${
goal.today.map(item=>`

<div style="margin-top:10px">

<input
type="checkbox"
${item.done?"checked":""}
onchange="toggleChild(${goal.id},'today',${item.id})"
>

${escapeHTML(item.text)}

<button
class="danger"
onclick="deleteChild(${goal.id},'today',${item.id})">
削除
</button>

</div>

`).join("")
}

<button
class="secondary"
style="margin-top:10px"
onclick="addChild(${goal.id},'today')">
＋ 今日の行動
</button>

</div>


<button
class="danger"
onclick="deleteGoal(${goal.id})">
🗑️ 目標を削除
</button>

</div>

`).join("");


home.innerHTML=
goals.map(goal=>`

<div class="goal">

<div class="goal-title">
🎯 ${escapeHTML(goal.name)}
</div>

<div class="small">
進捗 ${goal.progress}%
</div>

<div class="progress">

<div
class="progress-bar"
style="width:${goal.progress}%">
</div>

</div>

</div>

`).join("");

}


function addTask(){

let input=
document.getElementById("taskInput");

let text=
input.value.trim();

if(!text)return;

tasks.push({

id:Date.now(),

text:text,

done:false

});

input.value="";

save();

renderTasks();

}


function toggleTask(id){

let task=
tasks.find(t=>t.id===id);

if(!task)return;

task.done=!task.done;

if(task.done){

exp+=30;

}else{

exp=Math.max(0,exp-30);

}

save();

updateLevel();

renderTasks();

}


function deleteTask(id){

tasks=
tasks.filter(t=>t.id!==id);

save();

renderTasks();

}


function renderTasks(){

let list=
document.getElementById("taskList");

if(tasks.length===0){

list.innerHTML=
'<div class="empty">今日の行動はありません。</div>';

return;

}

list.innerHTML=
tasks.map(task=>`

<div style="
padding:14px 0;
border-bottom:1px solid #eee;
">

<input
type="checkbox"
${task.done?"checked":""}
onchange="toggleTask(${task.id})"
>

<span style="
${task.done
?"text-decoration:line-through;color:#999;"
:""}
">

${escapeHTML(task.text)}

</span>

<button
class="danger"
onclick="deleteTask(${task.id})">
削除
</button>

</div>

`).join("");

}


async function createPlan() {

  if (goals.length === 0) {
    alert("まず「目標」から目標を登録してください。");
    return;
  }

  const goal = goals[0];

  const result = document.getElementById("aiResult");
  const plan = document.getElementById("planText");

  result.style.display = "block";
  plan.innerHTML = "🤖 AIが計画を考えています…";

  try {

    const response = await fetch(
      "https://llm-chat-app-template.5j74j4gzkj.workers.dev/",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messages: [
            {
              role: "user",
              content: `あなたはNEXTのAIコーチです。

ユーザーの目標：
${goal.name}

この目標を達成するために、
今月・今週・今日の3段階で、
高校生でも実行しやすい具体的な計画を作ってください。

特に「今日やること」は3つ以内にしてください。

日本語で回答してください。`
            }
          ]
        })
      }
    );

    if (!response.ok) {
      throw new Error("AIとの通信に失敗しました");
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder("utf-8");

    let text = "";

    while (true) {

      const { value, done } = await reader.read();

      if (done) break;

      const chunk = decoder.decode(value, {
        stream: true
      });

      text += chunk;

      plan.innerHTML =
        "<div class='child'>" +
        "<div class='child-title'>🤖 AIコーチからの提案</div>" +
        "<p>" +
        escapeHTML(text).replace(/\n/g, "<br>") +
        "</p>" +
        "</div>";
    }

  } catch (error) {

    console.error(error);

    plan.innerHTML =
      "<p>⚠️ AIとの通信に失敗しました。</p>";

  }

}
  function escapeHTML(text){

let div=
document.createElement("div");

div.textContent=text;

return div.innerHTML;

}


function showPage(page,button){

document
.querySelectorAll(".page")
.forEach(
p=>p.classList.remove("active")
);

document
.getElementById(page)
.classList.add("active");

document
.querySelectorAll("nav button")
.forEach(
b=>b.classList.remove("active")
);

button.classList.add("active");

}


updateLevel();

renderGoals();

renderTasks();

</script>

<!-- AI COACH -->
<div id="aiCoach" class="page">

  <div class="card">

    <h2>🤖 AIコーチ</h2>

    <p class="small">
      あなたの目標から、次にやるべきことを整理します。
    </p>

    <button class="full" onclick="createPlan()">
      ✨ 計画を作る
    </button>

  </div>

  <div class="card" id="aiResult" style="display:none;">

    <h2>📋 今週のプラン</h2>

    <div id="planText"></div>

  </div>

</div>

</body>
</html>
