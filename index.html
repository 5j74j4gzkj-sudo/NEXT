<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXT</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: #f5f7fb;
  color: #171717;
}

.app {
  max-width: 600px;
  margin: auto;
  min-height: 100vh;
  padding-bottom: 100px;
}

header {
  padding: 35px 22px 20px;
}

.logo {
  font-size: 34px;
  font-weight: 800;
}

.subtitle {
  color: #777;
  margin-top: 4px;
}

.card {
  background: white;
  margin: 12px 18px;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.05);
}

.level {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.level-number {
  font-size: 32px;
  font-weight: 800;
}

.exp {
  color: #777;
}

.progress {
  height: 10px;
  background: #e8e8e8;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 14px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #111;
  border-radius: 10px;
  transition: width 0.3s;
}

h2 {
  font-size: 20px;
  margin-top: 0;
}

.goal {
  padding: 15px 0;
  border-bottom: 1px solid #eee;
}

.goal:last-child {
  border-bottom: none;
}

.goal-name {
  font-weight: 700;
  font-size: 18px;
}

.goal-date {
  color: #777;
  font-size: 14px;
  margin-top: 4px;
}

.goal-percent {
  margin-top: 8px;
  font-size: 14px;
  color: #777;
}

.delete {
  margin-top: 10px;
  background: #eee;
  color: #555;
  padding: 8px 12px;
  font-size: 13px;
}

.task {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid #eee;
}

.task input {
  width: 22px;
  height: 22px;
}

.task.done span {
  text-decoration: line-through;
  color: #999;
}

button {
  border: none;
  border-radius: 12px;
  padding: 12px 18px;
  font-size: 15px;
  font-weight: 600;
  background: #111;
  color: white;
}

.add {
  width: 100%;
  margin-top: 15px;
}

input[type="text"],
input[type="date"],
input[type="number"] {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
  margin-top: 8px;
  margin-bottom: 12px;
}

label.form-label {
  font-size: 14px;
  color: #666;
}

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 78px;
  background: rgba(255,255,255,0.96);
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

nav button {
  background: none;
  color: #777;
  font-size: 13px;
  padding: 8px;
}

nav button.active {
  color: #111;
  font-weight: 800;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.empty {
  text-align: center;
  color: #999;
  padding: 20px 0;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">NEXT</div>
  <div class="subtitle">昨日の自分を、今日超える。</div>
</header>


<!-- HOME -->
<main id="home" class="page active">

<div class="card">

  <div class="level">

    <div>
      <div class="exp">CURRENT LEVEL</div>
      <div class="level-number">
        LEVEL <span id="level">1</span>
      </div>
    </div>

    <div class="exp">
      <span id="exp">0</span> EXP
    </div>

  </div>

  <div class="progress">
    <div class="progress-bar" id="levelProgress"></div>
  </div>

</div>


<div class="card">

  <h2>🎯 今日の進捗</h2>

  <div class="progress">
    <div class="progress-bar" id="dayProgress"></div>
  </div>

  <p id="progressText">0 / 3 完了</p>

</div>


<div class="card">

  <h2>🔥 今日やること</h2>

  <div id="tasks">

    <label class="task">
      <input type="checkbox" onchange="completeTask(this)">
      <span>バドミントンを練習する</span>
    </label>

    <label class="task">
      <input type="checkbox" onchange="completeTask(this)">
      <span>勉強を30分する</span>
    </label>

    <label class="task">
      <input type="checkbox" onchange="completeTask(this)">
      <span>AI開発を30分する</span>
    </label>

  </div>

</div>


<div class="card">

  <h2>🏆 目標</h2>

  <div id="homeGoals"></div>

</div>

</main>


<!-- GOALS -->
<main id="goals" class="page">

<div class="card">

  <h2>🎯 目標を追加</h2>

  <label class="form-label">目標名</label>

  <input
    type="text"
    id="goalName"
    placeholder="例：京都TOP16"
  >

  <label class="form-label">期限</label>

  <input
    type="date"
    id="goalDate"
  >

  <label class="form-label">現在の進捗（0〜100）</label>

  <input
    type="number"
    id="goalProgress"
    min="0"
    max="100"
    value="0"
  >

  <button class="add" onclick="addGoal()">
    ＋ 目標を追加
  </button>

</div>


<div class="card">

  <h2>📋 あなたの目標</h2>

  <div id="goalList"></div>

</div>

</main>


<!-- TASKS -->
<main id="taskPage" class="page">

<div class="card">

  <h2>✓ タスク</h2>

  <p>
    今日やることを完了するとEXPを獲得できます。
  </p>

  <p>
    <strong>1タスク = 30 EXP</strong>
  </p>

</div>

</main>


<!-- REVIEW -->
<main id="review" class="page">

<div class="card">

  <h2>📝 振り返り</h2>

  <p>
    今日の振り返り機能は次のアップデートで追加します。
  </p>

  <p>
    「今日できたこと」「課題」「明日やること」を記録できるようにする予定です。
  </p>

</div>

</main>


<nav>

<button id="navHome" class="active" onclick="showPage('home')">
🏠<br>ホーム
</button>

<button id="navGoals" onclick="showPage('goals')">
🎯<br>目標
</button>

<button id="navTasks" onclick="showPage('taskPage')">
✓<br>タスク
</button>

<button id="navReview" onclick="showPage('review')">
📝<br>振り返り
</button>

</nav>

</div>


<script>

let exp = Number(localStorage.getItem("nextExp")) || 0;

let goals =
  JSON.parse(localStorage.getItem("nextGoals")) || [];


function updateLevel() {

  const level =
    Math.floor(exp / 100) + 1;

  const currentExp =
    exp % 100;

  document.getElementById("level")
    .textContent = level;

  document.getElementById("exp")
    .textContent = exp;

  document.getElementById("levelProgress")
    .style.width = currentExp + "%";

  localStorage.setItem(
    "nextExp",
    exp
  );
}


function completeTask(checkbox) {

  const task =
    checkbox.parentElement;

  if (checkbox.checked) {

    task.classList.add("done");

    exp += 30;

  } else {

    task.classList.remove("done");

    exp = Math.max(0, exp - 30);

  }

  updateLevel();

  updateDayProgress();

}


function updateDayProgress() {

  const checkboxes =
    document.querySelectorAll(
      "#tasks input[type=checkbox]"
    );

  const completed =
    [...checkboxes].filter(
      checkbox => checkbox.checked
    ).length;

  const total =
    checkboxes.length;

  const percent =
    total === 0
      ? 0
      : completed / total * 100;

  document.getElementById(
    "dayProgress"
  ).style.width = percent + "%";

  document.getElementById(
    "progressText"
  ).textContent =
    completed + " / " + total + " 完了";
}


function addGoal() {

  const name =
    document.getElementById("goalName")
      .value.trim();

  const date =
    document.getElementById("goalDate")
      .value;

  let progress =
    Number(
      document.getElementById("goalProgress")
        .value
    );

  if (!name) {

    alert("目標名を入力してください");

    return;

  }

  progress =
    Math.min(
      100,
      Math.max(0, progress)
    );


  const goal = {

    id: Date.now(),

    name: name,

    date: date,

    progress: progress

  };


  goals.push(goal);

  saveGoals();

  renderGoals();


  document.getElementById(
    "goalName"
  ).value = "";

  document.getElementById(
    "goalDate"
  ).value = "";

  document.getElementById(
    "goalProgress"
  ).value = 0;

}


function deleteGoal(id) {

  goals =
    goals.filter(
      goal => goal.id !== id
    );

  saveGoals();

  renderGoals();

}


function saveGoals() {

  localStorage.setItem(
    "nextGoals",
    JSON.stringify(goals)
  );

}


function renderGoals() {

  const list =
    document.getElementById("goalList");

  const home =
    document.getElementById("homeGoals");


  if (goals.length === 0) {

    list.innerHTML =
      '<div class="empty">まだ目標がありません。</div>';

    home.innerHTML =
      '<div class="empty">「目標」から追加してみよう。</div>';

    return;

  }


  list.innerHTML =
    goals.map(goal => `

      <div class="goal">

        <div class="goal-name">
          ${escapeHTML(goal.name)}
        </div>

        ${
          goal.date
          ? `<div class="goal-date">
              期限：${goal.date}
             </div>`
          : ""
        }

        <div class="goal-percent">
          進捗 ${goal.progress}%
        </div>

        <div class="progress">

          <div
            class="progress-bar"
            style="width:${goal.progress}%">
          </div>

        </div>

        <button
          class="delete"
          onclick="deleteGoal(${goal.id})">
          🗑️ 削除
        </button>

      </div>

    `).join("");


  home.innerHTML =
    goals.map(goal => `

      <div class="goal">

        <div class="goal-name">
          ${escapeHTML(goal.name)}
        </div>

        <div class="goal-percent">
          ${goal.progress}%
        </div>

        <div class="progress">

          <div
            class="progress-bar"
            style="width:${goal.progress}%">
          </div>

        </div>

      </div>

    `).join("");

}


function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


function showPage(page) {

  document
    .querySelectorAll(".page")
    .forEach(
      element =>
        element.classList.remove("active")
    );


  document
    .getElementById(page)
    .classList.add("active");


  document
    .querySelectorAll("nav button")
    .forEach(
      button =>
        button.classList.remove("active")
    );


  if (page === "home") {

    document
      .getElementById("navHome")
      .classList.add("active");

  }

  if (page === "goals") {

    document
      .getElementById("navGoals")
      .classList.add("active");

  }

  if (page === "taskPage") {

    document
      .getElementById("navTasks")
      .classList.add("active");

  }

  if (page === "review") {

    document
      .getElementById("navReview")
      .classList.add("active");

  }

}


updateLevel();

renderGoals();

updateDayProgress();

</script>

</body>
</html>
